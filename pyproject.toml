[project]
name = "mead-download"
version = "0.1.0"
description = "This is a tiny MEAD dataset downloader."
authors = [{name = "Alex Hickey"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "gdown>=5.2.0",
    "pandas>=2.3.1",
    "pycurl>=7.45.6",
    "tqdm>=4.67.1",
    "google-auth>=2.56.0,<3",
    "google-auth-oauthlib>=1.4.0,<2",
    "requests>=2.34.2,<3"
]
urls = { Source = "https://github.com/alexeatscake/mead-download" }